name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8

      - name: Install Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install pinned Deno for Supabase Edge checks
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.1

      - name: Install Java 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pinned Rust checks
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component clippy,rustfmt
          rustup default 1.96.1

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm verify

      - name: Verify Supabase Edge Function
        run: pnpm edge:check

      - name: Compile and test the real Paper plugin
        working-directory: minecraft/paper-plugin
        run: ./gradlew --no-daemon check

  windows-bootstrap:
    name: Windows bootstrap smoke test
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8

      - name: Install Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Java 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pinned Rust checks
        shell: pwsh
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component clippy,rustfmt
          rustup default 1.96.1

      - name: Install and verify
        run: |
          pnpm install --frozen-lockfile
          pnpm verify

      - name: Compile and test the Paper plugin on Windows
        working-directory: minecraft/paper-plugin
        shell: pwsh
        run: .\gradlew.bat --no-daemon check

  host-windows-installer:
    name: Unsigned Host NSIS prototype
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8

      - name: Install Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Java 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
          rustc --version

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin for the Host installer
        shell: pwsh
        run: |
          .\minecraft\paper-plugin\gradlew.bat --no-daemon check jar
          New-Item -ItemType Directory -Force apps/host-windows/src-tauri/bundled | Out-Null
          Copy-Item minecraft/paper-plugin/build/libs/badgerbots-paper-plugin.jar apps/host-windows/src-tauri/bundled/badgerbots-paper-plugin.jar

      - name: Test native Host core
        run: cargo test --manifest-path apps/host-windows/src-tauri/Cargo.toml --locked

      - name: Build unsigned NSIS prototype
        run: pnpm --filter @badgerbots/host-windows tauri build --bundles nsis
        env:
          VITE_BADGERBOTS_SUPABASE_URL: ${{ vars.BADGERBOTS_SUPABASE_URL }}
          VITE_BADGERBOTS_SUPABASE_PUBLISHABLE_KEY: ${{ vars.BADGERBOTS_SUPABASE_PUBLISHABLE_KEY }}

      - name: Record installer checksum
        shell: pwsh
        run: |
          Get-ChildItem apps/host-windows/src-tauri/target/release/bundle/nsis/*-setup.exe |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content apps/host-windows/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt

      - name: Upload unsigned internal prototype
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: badgerbots-host-unsigned-windows-x64
          path: |
            apps/host-windows/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/host-windows/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  connect-windows-installer:
    name: Unsigned Connect NSIS prototype
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8

      - name: Install Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
          rustc --version

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Test native Connect core
        run: cargo test --manifest-path apps/student-connect/src-tauri/Cargo.toml --locked

      - name: Build unsigned NSIS prototype
        run: pnpm --filter @badgerbots/student-connect tauri build --bundles nsis

      - name: Record installer checksum
        shell: pwsh
        run: |
          Get-ChildItem apps/student-connect/src-tauri/target/release/bundle/nsis/*-setup.exe |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content apps/student-connect/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt

      - name: Upload unsigned internal prototype
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: badgerbots-connect-unsigned-windows-x64
          path: |
            apps/student-connect/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/student-connect/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
