name: Deploy Supabase production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type deploy to apply the reviewed production migration and Edge Function
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: badgerbots-supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy classroom service
    if: github.event.inputs.confirmation == 'deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8

      - name: Install Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Validate protected production settings
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_URL"
          test -n "$SUPABASE_PROJECT_REF"
          case "$SUPABASE_DB_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "SUPABASE_DB_URL must be a PostgreSQL connection URL." >&2; exit 1 ;;
          esac
          case "$SUPABASE_PROJECT_REF" in
            *[!a-z0-9]*) echo "SUPABASE_PROJECT_REF is invalid." >&2; exit 1 ;;
          esac

      - name: Apply reviewed instructor identity migration
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: >-
          psql "$DATABASE_URL"
          --set ON_ERROR_STOP=1
          --file database/providers/supabase/0007_instructor_identity_recovery.sql

      - name: Apply reviewed device and player routing migrations
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DATABASE_URL" \
            --set ON_ERROR_STOP=1 \
            --file database/migrations/0008_device_player_routing.sql
          psql "$DATABASE_URL" \
            --set ON_ERROR_STOP=1 \
            --file database/providers/supabase/0009_device_player_routing_security.sql

      - name: Deploy authenticated classroom API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: >-
          pnpm dlx supabase@2.109.1 functions deploy classroom-api
          --project-ref "$SUPABASE_PROJECT_REF"
