name: BadgerBotsCodeStudio
version: 0.6.1-prototype
main: org.badgerbots.studio.paper.BadgerBotsPlugin
description: Scoped BadgerBots educational runtime for Minecraft
author: BadgerBots
api-version: "1.21.11"
load: POSTWORLD
commands:
  bbvisit:
    description: Approve or join a private BadgerBots world visit
    usage: /bbvisit allow <player> or /bbvisit join <owner>
    permission: badgerbots.visit
  bbbenchmark:
    description: Run a bounded 25-student Paper capacity benchmark
    usage: /bbbenchmark separate-worlds or /bbbenchmark shared-instances
    permission: badgerbots.benchmark
permissions:
  badgerbots.visit:
    description: Use owner-approved BadgerBots world visits
    default: true
  badgerbots.benchmark:
    description: Run the protected BadgerBots capacity benchmark
    default: op
