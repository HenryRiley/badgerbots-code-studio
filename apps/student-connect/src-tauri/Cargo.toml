[package]
name = "badgerbots-connect"
version = "0.1.0"
description = "BadgerBots Connect student device helper"
authors = ["BadgerBots"]
edition = "2024"
rust-version = "1.96.1"

[lib]
name = "badgerbots_connect_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
tauri = { version = "=2.11.5", features = [] }
uuid = { version = "=1.24.0", features = ["v4"] }
