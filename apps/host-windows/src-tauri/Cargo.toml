[package]
name = "badgerbots-host"
version = "0.8.2"
description = "BadgerBots Host teacher-laptop application"
authors = ["BadgerBots"]
edition = "2024"
rust-version = "1.96.1"
license = "UNLICENSED"

[lib]
name = "badgerbots_host_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
getrandom = "=0.3.4"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "native-tls-no-alpn"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Power", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
