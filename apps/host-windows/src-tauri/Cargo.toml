[package]
name = "badgerbots-host"
version = "0.1.0"
description = "BadgerBots Host teacher-laptop application"
authors = ["BadgerBots"]
edition = "2024"
rust-version = "1.96.1"
license = "UNLICENSED"

[lib]
name = "badgerbots_host_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
tauri = { version = "=2.11.5", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
